name: async-payments-service

x-service-build: &service-build
  context: .
  dockerfile: Dockerfile

x-application-environment: &application-environment
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/payments
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  API_KEY: dev-api-key
  MAX_RETRIES: "3"
  RETRY_BASE_DELAY: "2"

x-postgres-dependency: &postgres-dependency
  postgres:
    condition: service_healthy

x-rabbitmq-dependency: &rabbitmq-dependency
  rabbitmq:
    condition: service_healthy

x-api-dependency: &api-dependency
  api:
    condition: service_healthy

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "async-payments-worker-healthcheck"]
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build: *service-build
    environment:
      <<: *application-environment
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      OUTBOX_BATCH_SIZE: "100"
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    depends_on:
      <<: [*postgres-dependency, *rabbitmq-dependency]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  consumer:
    build: *service-build
    command: ["async-payments-consumer"]
    environment:
      <<: *application-environment
      WEBHOOK_TIMEOUT: "10"
      GATEWAY_MIN_DELAY: "2"
      GATEWAY_MAX_DELAY: "5"
      GATEWAY_SUCCESS_RATE: "0.9"
    depends_on:
      <<: [*postgres-dependency, *rabbitmq-dependency, *api-dependency]
    healthcheck: *worker-healthcheck

  outbox-publisher:
    build: *service-build
    command: ["async-payments-outbox-publisher"]
    environment:
      <<: *application-environment
      OUTBOX_BATCH_SIZE: "100"
      OUTBOX_POLL_INTERVAL: "1"
    depends_on:
      <<: [*postgres-dependency, *rabbitmq-dependency, *api-dependency]
    healthcheck: *worker-healthcheck

  webhook-receiver:
    build: *service-build
    command: ["async-payments-webhook-receiver"]
    ports:
      - "9000:9000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:9000/health", timeout=5)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  rabbitmq-data:
